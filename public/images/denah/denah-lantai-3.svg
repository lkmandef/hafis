<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" class="select-none">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="650" fill="#f8fafc"/>
  <rect width="1000" height="650" fill="url(#grid3)"/>

  <!-- Building Outer Boundary -->
  <rect x="50" y="50" width="900" height="550" rx="8" fill="#ffffff" stroke="#334155" stroke-width="4"/>

  <!-- North Arrow & Scale Bar -->
  <g transform="translate(890, 75)">
    <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="20,8 14,24 20,20" fill="#dc2626"/>
    <polygon points="20,8 26,24 20,20" fill="#64748b"/>
    <text x="20" y="6" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">U</text>
  </g>

  <!-- Title Block on Floor Plan -->
  <g transform="translate(70, 75)">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">DENAH GEDUNG UTAMA : LANTAI 3</text>
    <text x="0" y="16" font-family="sans-serif" font-size="10" font-weight="medium" fill="#64748b">Instalasi Bedah Sentral (IBS / OK), Intensive Care Unit (ICU) &amp; CSSD</text>
  </g>

  <!-- ROOM 1: INSTALASI BEDAH SENTRAL / OK (Left Wing) -->
  <g id="wing-ibs">
    <rect x="65" y="120" width="410" height="465" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" rx="4"/>
    <rect x="65" y="120" width="410" height="24" fill="#ccfbf1"/>
    <text x="75" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">INSTALASI BEDAH SENTRAL (IBS / OK) : ZONA STERIL</text>

    <!-- Kamar Bedah 1 -->
    <rect x="80" y="155" width="125" height="135" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" rx="3"/>
    <text x="142" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#115e59" text-anchor="middle">Kamar Bedah OK 1</text>
    <text x="142" y="230" font-family="sans-serif" font-size="8" fill="#134e4a" text-anchor="middle">Bedah Umum</text>

    <!-- Kamar Bedah 2 -->
    <rect x="220" y="155" width="125" height="135" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" rx="3"/>
    <text x="282" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#115e59" text-anchor="middle">Kamar Bedah OK 2</text>
    <text x="282" y="230" font-family="sans-serif" font-size="8" fill="#134e4a" text-anchor="middle">Bedah Ortopedi</text>

    <!-- Scrub Station Corridor -->
    <rect x="80" y="305" width="265" height="45" fill="#e6fffa" stroke="#99f6e4" stroke-width="1.5" rx="3"/>
    <text x="212" y="332" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f766e" text-anchor="middle">Scrub Station &amp; Cuci Tangan Bedah</text>

    <!-- Kamar Bedah 3 (Target APAR-OK-01) -->
    <rect x="80" y="365" width="180" height="150" fill="#ffffff" stroke="#5eead4" stroke-width="2" rx="3"/>
    <rect x="80" y="365" width="180" height="20" fill="#ccfbf1"/>
    <text x="170" y="379" font-family="sans-serif" font-size="9" font-weight="bold" fill="#115e59" text-anchor="middle">Bedah Sentral (OK 3)</text>
    <text x="170" y="435" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f766e" text-anchor="middle">Ruang Operasi Khusus</text>
    <text x="170" y="450" font-family="sans-serif" font-size="8" fill="#134e4a" text-anchor="middle">Peralatan Gas Medis &amp; C-Arm</text>

    <!-- Recovery Room (PACU) -->
    <rect x="275" y="365" width="185" height="150" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" rx="3"/>
    <text x="367" y="435" font-family="sans-serif" font-size="10" font-weight="bold" fill="#115e59" text-anchor="middle">Ruang Pemulihan (PACU)</text>
    <text x="367" y="450" font-family="sans-serif" font-size="8" fill="#134e4a" text-anchor="middle">6 Bed Pasca Operasi</text>

    <!-- Ruang Dokter Bedah -->
    <rect x="80" y="525" width="380" height="50" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" rx="3"/>
    <text x="270" y="555" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f766e" text-anchor="middle">Ruang Dokter Bedah &amp; Diskusi Anestesi</text>
  </g>

  <!-- CENTRAL CORRIDOR LANTAI 3 -->
  <g id="corridor-lt3">
    <rect x="490" y="120" width="80" height="465" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="530" y="330" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 530 330)">KORIDOR AIRLOCK LT. 3</text>
  </g>

  <!-- ROOM 2: ICU & CSSD STERILISASI (Right Wing) -->
  <g id="wing-icu-cssd">
    <rect x="585" y="120" width="180" height="465" fill="#fdf2f8" stroke="#db2777" stroke-width="2" rx="4"/>
    <rect x="585" y="120" width="180" height="24" fill="#fce7f3"/>
    <text x="595" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9d174d">ICU &amp; CSSD STERIL</text>

    <!-- ICU (Intensive Care Unit) -->
    <rect x="600" y="155" width="150" height="190" fill="#ffffff" stroke="#f472b6" stroke-width="1.5" rx="3"/>
    <text x="675" y="240" font-family="sans-serif" font-size="10" font-weight="bold" fill="#be185d" text-anchor="middle">Intensive Care Unit (ICU)</text>
    <text x="675" y="255" font-family="sans-serif" font-size="8" fill="#9d174d" text-anchor="middle">Ventilator &amp; Pasien Kritis</text>

    <!-- CSSD Sterilisasi Alat Medis -->
    <rect x="600" y="360" width="150" height="215" fill="#ffffff" stroke="#f472b6" stroke-width="1.5" rx="3"/>
    <text x="675" y="460" font-family="sans-serif" font-size="10" font-weight="bold" fill="#be185d" text-anchor="middle">Instalasi CSSD</text>
    <text x="675" y="475" font-family="sans-serif" font-size="8" fill="#9d174d" text-anchor="middle">Autoclave &amp; Mesin Uap Panas</text>
  </g>

  <!-- STAIRS & ELEVATORS (Far-Right Wing) -->
  <g id="vertical-transport-lt3">
    <rect x="780" y="120" width="155" height="465" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="4"/>
    <rect x="780" y="120" width="155" height="24" fill="#e2e8f0"/>
    <text x="790" y="136" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">AKSES TANGGA &amp; LIFT</text>

    <!-- Elevator 1 -->
    <rect x="795" y="170" width="125" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
    <text x="857" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">Lift Khusus OK</text>
    <text x="857" y="230" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Akses Pasien Steril</text>

    <!-- Stairs -->
    <g transform="translate(795, 290)">
      <rect x="0" y="0" width="125" height="150" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
      <line x1="10" y1="25" x2="115" y2="25" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="50" x2="115" y2="50" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="75" x2="115" y2="75" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="100" x2="115" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="125" x2="115" y2="125" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="62" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Tangga Darurat</text>
    </g>

    <!-- Emergency Exit Sign -->
    <rect x="805" y="465" width="105" height="24" fill="#16a34a" rx="3"/>
    <text x="857" y="481" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PINTU EVAKUASI</text>
  </g>

  <!-- Scale Bar footer -->
  <g transform="translate(50, 618)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#64748b" stroke-width="1.5"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="14" font-family="sans-serif" font-size="8" fill="#64748b">0m</text>
    <text x="50" y="14" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">10m</text>
    <text x="100" y="14" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">20m</text>
  </g>
</svg>
