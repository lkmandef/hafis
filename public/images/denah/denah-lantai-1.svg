<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" class="select-none">
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="650" fill="#f8fafc"/>
  <rect width="1000" height="650" fill="url(#grid1)"/>

  <!-- Building Outer Boundary -->
  <rect x="50" y="50" width="900" height="550" rx="8" fill="#ffffff" stroke="#334155" stroke-width="4"/>

  <!-- North Arrow & Scale Bar -->
  <g transform="translate(890, 75)">
    <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="20,8 14,24 20,20" fill="#dc2626"/>
    <polygon points="20,8 26,24 20,20" fill="#64748b"/>
    <text x="20" y="6" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">U</text>
  </g>

  <!-- Title Block on Floor Plan -->
  <g transform="translate(70, 75)">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">DENAH GEDUNG UTAMA : LANTAI 1</text>
    <text x="0" y="16" font-family="sans-serif" font-size="10" font-weight="medium" fill="#64748b">Area Layanan Darurat, Rawat Jalan, Radiologi &amp; Penunjang</text>
  </g>

  <!-- ROOM 1: IGD & ZONA TRIASE (Top-Left / Mid-Left) -->
  <g id="room-igd">
    <rect x="65" y="120" width="280" height="260" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="0" rx="4"/>
    <rect x="65" y="120" width="280" height="24" fill="#fee2e2"/>
    <text x="75" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">INSTALASI GAWAT DARURAT (IGD)</text>
    
    <!-- Sub-zones in IGD -->
    <rect x="80" y="155" width="120" height="100" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" rx="3"/>
    <text x="140" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Zona Triase</text>
    <text x="140" y="210" font-family="sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">Prioritas 1 &amp; 2</text>

    <rect x="215" y="155" width="115" height="100" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" rx="3"/>
    <text x="272" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Tindakan Resusitasi</text>
    <text x="272" y="210" font-family="sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">Kritis</text>

    <rect x="80" y="270" width="250" height="95" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" rx="3"/>
    <text x="205" y="315" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Ruang Observasi IGD</text>
    <text x="205" y="330" font-family="sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">6 Tempat Tidur</text>

    <!-- Emergency Exit IGD -->
    <rect x="65" y="380" width="70" height="15" fill="#16a34a"/>
    <text x="100" y="391" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PINTU DARURAT</text>
  </g>

  <!-- ROOM 2: RADIOLOGI & MRI (Bottom-Left) -->
  <g id="room-radiologi">
    <rect x="65" y="410" width="280" height="175" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" rx="4"/>
    <rect x="65" y="410" width="280" height="24" fill="#f3e8ff"/>
    <text x="75" y="426" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6b21a8">INSTALASI RADIOLOGI</text>

    <rect x="80" y="445" width="125" height="125" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" rx="3"/>
    <text x="142" y="500" font-family="sans-serif" font-size="10" font-weight="bold" fill="#581c87" text-anchor="middle">Ruang MRI</text>
    <text x="142" y="515" font-family="sans-serif" font-size="8" fill="#6b21a8" text-anchor="middle">Area Non-Magnetic</text>

    <rect x="220" y="445" width="110" height="125" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" rx="3"/>
    <text x="275" y="500" font-family="sans-serif" font-size="10" font-weight="bold" fill="#581c87" text-anchor="middle">Ruang X-Ray</text>
    <text x="275" y="515" font-family="sans-serif" font-size="8" fill="#6b21a8" text-anchor="middle">CT Scan</text>
  </g>

  <!-- CENTRAL CORRIDOR -->
  <g id="corridor-central">
    <rect x="360" y="120" width="170" height="465" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="445" y="320" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 445 320)">KORIDOR UTAMA LANTAI 1</text>
    
    <!-- Evacuation Arrows -->
    <path d="M 445 200 L 445 160 M 440 170 L 445 160 L 450 170" stroke="#16a34a" stroke-width="2" fill="none"/>
    <path d="M 445 460 L 445 500 M 440 490 L 445 500 L 450 490" stroke="#16a34a" stroke-width="2" fill="none"/>

    <!-- Lobby Entrance Door at bottom of corridor -->
    <rect x="390" y="585" width="110" height="15" fill="#0284c7"/>
    <text x="445" y="596" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">LOBBY UTAMA / PINTU MASUK</text>
  </g>

  <!-- ROOM 3: FARMASI & PENDAFTARAN (Top-Right) -->
  <g id="room-farmasi">
    <rect x="545" y="120" width="390" height="130" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="4"/>
    <rect x="545" y="120" width="390" height="24" fill="#dcfce7"/>
    <text x="555" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">DEPO FARMASI &amp; PENDAFTARAN RAWAT JALAN</text>

    <rect x="560" y="155" width="180" height="80" fill="#ffffff" stroke="#86efac" stroke-width="1.5" rx="3"/>
    <text x="650" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Depo Farmasi 24 Jam</text>
    <text x="650" y="210" font-family="sans-serif" font-size="8" fill="#14532d" text-anchor="middle">Penyimpanan Obat</text>

    <rect x="755" y="155" width="165" height="80" fill="#ffffff" stroke="#86efac" stroke-width="1.5" rx="3"/>
    <text x="837" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Loket Pendaftaran</text>
    <text x="837" y="210" font-family="sans-serif" font-size="8" fill="#14532d" text-anchor="middle">Admisi &amp; Kasir</text>
  </g>

  <!-- ROOM 4: INSTALASI DAPUR GIZI (Mid-Right) -->
  <g id="room-gizi">
    <rect x="545" y="265" width="220" height="155" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="4"/>
    <rect x="545" y="265" width="220" height="24" fill="#fef3c7"/>
    <text x="555" y="281" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">INSTALASI GIZI &amp; DAPUR</text>

    <rect x="560" y="300" width="190" height="105" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" rx="3"/>
    <text x="655" y="345" font-family="sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Area Pengolahan Makanan</text>
    <text x="655" y="360" font-family="sans-serif" font-size="8" fill="#78350f" text-anchor="middle">Kompor &amp; Tabung Gas LPG</text>
  </g>

  <!-- ROOM 5: RUANG PANEL LISTRIK & GENSET (Bottom-Right Corner) -->
  <g id="room-panel">
    <rect x="545" y="435" width="220" height="150" fill="#f1f5f9" stroke="#475569" stroke-width="2" rx="4"/>
    <rect x="545" y="435" width="220" height="24" fill="#e2e8f0"/>
    <text x="555" y="451" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">RUANG PANEL LISTRIK &amp; GENSET</text>

    <rect x="560" y="470" width="190" height="100" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
    <text x="655" y="515" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Main Distribution Panel (MDP)</text>
    <text x="655" y="530" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">Bahaya Listrik Tegangan Tinggi</text>
  </g>

  <!-- STAIRS & ELEVATORS (Far-Right Wing) -->
  <g id="vertical-transport">
    <rect x="780" y="265" width="155" height="320" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="4"/>
    <rect x="780" y="265" width="155" height="24" fill="#e2e8f0"/>
    <text x="790" y="281" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">AKSES TANGGA &amp; LIFT</text>

    <!-- Elevator 1 -->
    <rect x="795" y="305" width="125" height="70" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
    <text x="857" y="340" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">Lift Bed Pasien</text>
    <text x="857" y="355" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Kapasitas 1600 Kg</text>

    <!-- Stairs -->
    <g transform="translate(795, 390)">
      <rect x="0" y="0" width="125" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
      <!-- Stair lines -->
      <line x1="10" y1="18" x2="115" y2="18" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="36" x2="115" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="54" x2="115" y2="54" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="72" x2="115" y2="72" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="62" y="50" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle" background="#ffffff">Tangga Darurat</text>
    </g>

    <!-- Emergency Exit Sign -->
    <rect x="805" y="555" width="105" height="22" fill="#16a34a" rx="3"/>
    <text x="857" y="570" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PINTU EVAKUASI</text>
  </g>

  <!-- Scale Bar footer -->
  <g transform="translate(50, 618)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#64748b" stroke-width="1.5"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="14" font-family="sans-serif" font-size="8" fill="#64748b">0m</text>
    <text x="50" y="14" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">10m</text>
    <text x="100" y="14" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">20m</text>
  </g>
</svg>
