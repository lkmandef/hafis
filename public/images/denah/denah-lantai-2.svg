<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" class="select-none">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="650" fill="#f8fafc"/>
  <rect width="1000" height="650" fill="url(#grid2)"/>

  <!-- Building Outer Boundary -->
  <rect x="50" y="50" width="900" height="550" rx="8" fill="#ffffff" stroke="#334155" stroke-width="4"/>

  <!-- North Arrow & Scale Bar -->
  <g transform="translate(890, 75)">
    <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="20,8 14,24 20,20" fill="#dc2626"/>
    <polygon points="20,8 26,24 20,20" fill="#64748b"/>
    <text x="20" y="6" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">U</text>
  </g>

  <!-- Title Block on Floor Plan -->
  <g transform="translate(70, 75)">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">DENAH GEDUNG UTAMA : LANTAI 2</text>
    <text x="0" y="16" font-family="sans-serif" font-size="10" font-weight="medium" fill="#64748b">Rawat Inap Melati, Laboratorium Klinis &amp; Pos Perawat</text>
  </g>

  <!-- ROOM 1: RAWAT INAP MELATI WING (Left Half) -->
  <g id="wing-melati">
    <rect x="65" y="120" width="380" height="465" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="4"/>
    <rect x="65" y="120" width="380" height="24" fill="#e0f2fe"/>
    <text x="75" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">ZONA RAWAT INAP MELATI</text>

    <!-- Nurse Station Melati (Central in Wing) -->
    <rect x="80" y="240" width="160" height="110" fill="#ffffff" stroke="#38bdf8" stroke-width="2" rx="4"/>
    <rect x="80" y="240" width="160" height="20" fill="#e0f2fe"/>
    <text x="160" y="254" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">Nurse Station Melati</text>
    <text x="160" y="295" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">Pos Kontrol Perawat</text>
    <text x="160" y="315" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Intercom &amp; Panel Alarm</text>

    <!-- Patient Rooms Top Row -->
    <rect x="80" y="155" width="105" height="75" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="132" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Kamar 201</text>
    <text x="132" y="210" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">VIP</text>

    <rect x="195" y="155" width="105" height="75" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="247" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Kamar 202</text>
    <text x="247" y="210" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Kelas 1</text>

    <rect x="310" y="155" width="120" height="150" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="370" y="230" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Kamar 203</text>
    <text x="370" y="245" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Kelas 2 (4 Bed)</text>

    <!-- Patient Rooms Bottom Row -->
    <rect x="80" y="365" width="105" height="100" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="132" y="415" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Kamar 204</text>
    <text x="132" y="430" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Isolasi</text>

    <rect x="195" y="365" width="105" height="100" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="247" y="415" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Kamar 205</text>
    <text x="247" y="430" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Kelas 1</text>

    <rect x="310" y="320" width="120" height="145" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="370" y="390" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Kamar 206</text>
    <text x="370" y="405" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Kelas 2 (4 Bed)</text>

    <!-- Ruang Konsultasi Dokter -->
    <rect x="80" y="480" width="350" height="90" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="3"/>
    <text x="255" y="525" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Ruang Dokter Jaga &amp; Istirahat Medis</text>
    <text x="255" y="540" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Fasilitas Staf Medis Melati</text>
  </g>

  <!-- CENTRAL CORRIDOR LANTAI 2 -->
  <g id="corridor-lt2">
    <rect x="460" y="120" width="90" height="465" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="505" y="330" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 505 330)">KORIDOR PENGHUBUNG LT. 2</text>
    
    <path d="M 505 220 L 505 180 M 500 190 L 505 180 L 510 190" stroke="#16a34a" stroke-width="2" fill="none"/>
    <path d="M 505 440 L 505 480 M 500 470 L 505 480 L 510 470" stroke="#16a34a" stroke-width="2" fill="none"/>
  </g>

  <!-- ROOM 2: LABORATORIUM KIMIA & PATOLOGI (Right Wing) -->
  <g id="wing-lab">
    <rect x="565" y="120" width="200" height="465" fill="#fefce8" stroke="#ca8a04" stroke-width="2" rx="4"/>
    <rect x="565" y="120" width="200" height="24" fill="#fef9c3"/>
    <text x="575" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e">LABORATORIUM KLINIS</text>

    <!-- Lab Kimia -->
    <rect x="580" y="155" width="170" height="150" fill="#ffffff" stroke="#fde047" stroke-width="1.5" rx="3"/>
    <text x="665" y="225" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a16207" text-anchor="middle">Laboratorium Kimia</text>
    <text x="665" y="240" font-family="sans-serif" font-size="8" fill="#854d0e" text-anchor="middle">Bahan Kimia &amp; Reagen</text>
    <text x="665" y="255" font-family="sans-serif" font-size="8" fill="#dc2626" text-anchor="middle">[Area Rawan Kebakaran B]</text>

    <!-- Lab Patologi -->
    <rect x="580" y="320" width="170" height="130" fill="#ffffff" stroke="#fde047" stroke-width="1.5" rx="3"/>
    <text x="665" y="380" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a16207" text-anchor="middle">Lab Patologi &amp; Darah</text>
    <text x="665" y="395" font-family="sans-serif" font-size="8" fill="#854d0e" text-anchor="middle">Bank Darah RS</text>

    <!-- Ruang Pengambilan Sampel -->
    <rect x="580" y="465" width="170" height="105" fill="#ffffff" stroke="#fde047" stroke-width="1.5" rx="3"/>
    <text x="665" y="515" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a16207" text-anchor="middle">Pengambilan Sampel</text>
    <text x="665" y="530" font-family="sans-serif" font-size="8" fill="#854d0e" text-anchor="middle">Flebotomi Pasien</text>
  </g>

  <!-- STAIRS & ELEVATORS (Far-Right Wing) -->
  <g id="vertical-transport-lt2">
    <rect x="780" y="120" width="155" height="465" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="4"/>
    <rect x="780" y="120" width="155" height="24" fill="#e2e8f0"/>
    <text x="790" y="136" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">AKSES TANGGA &amp; LIFT</text>

    <!-- Elevator 1 -->
    <rect x="795" y="170" width="125" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
    <text x="857" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">Lift Bed Pasien</text>
    <text x="857" y="230" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Akses Lt. 1 - 3</text>

    <!-- Stairs -->
    <g transform="translate(795, 290)">
      <rect x="0" y="0" width="125" height="150" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
      <!-- Stair lines -->
      <line x1="10" y1="25" x2="115" y2="25" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="50" x2="115" y2="50" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="75" x2="115" y2="75" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="100" x2="115" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="10" y1="125" x2="115" y2="125" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="62" y="80" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Tangga Darurat</text>
    </g>

    <!-- Emergency Exit Sign -->
    <rect x="805" y="465" width="105" height="24" fill="#16a34a" rx="3"/>
    <text x="857" y="481" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PINTU EVAKUASI</text>
  </g>

  <!-- Scale Bar footer -->
  <g transform="translate(50, 618)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#64748b" stroke-width="1.5"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="14" font-family="sans-serif" font-size="8" fill="#64748b">0m</text>
    <text x="50" y="14" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">10m</text>
    <text x="100" y="14" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">20m</text>
  </g>
</svg>
